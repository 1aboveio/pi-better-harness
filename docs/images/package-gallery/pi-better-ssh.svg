<text x="60" y="548" font-family="Menlo" font-size="20" font-weight="400" fill="#fafafa" xml:space="preserve" textLength="384" lengthAdjust="spacingAndGlyphs">staging: mux up - Master running</text>
  <path d="M48 675 H1152" stroke="#3f3f46"/>
  <text x="48" y="706" font-family="Menlo" font-size="20" fill="#38bdf8">$ pi install npm:pi-better-ssh</text>
