  <text x="48" y="94" font-family="Helvetica" font-size="34" font-weight="700" fill="#fafafa">Remote commands. Local clarity.</text>
  <text x="48" y="128" font-family="Helvetica" font-size="19" fill="#b4b4bc">Explicit remote tools / saved host profiles / reusable connections</text>
