# Mergify — two-step merge queue (review-gated auto-enqueue).
#
# Step 1 (queue entry): check-success = ci           — every PR
# Step 2 (merge gate):  check-success = integration  — merge-queue branches only
#
# Enqueue: automatic after CI + review pass, or manually with
# `@mergifyio queue` / the queue checkbox.
#
# Validate: mergify config validate

shared:
  gate: &gate check-success = ci
  queue_gate: &queue_gate check-success = integration

queue_rules:
  - name: default
    # Mergify Merge Protections is a required ruleset check that fails pre-queue;
    # inject GitHub requirements only at merge time so enqueue is not deadlocked.
    branch_protection_injection_mode: merge

    queue_conditions:
      - base = main
      - *gate

    merge_conditions:
      - *gate
      - *queue_gate

    # Batch mode: 3 PRs -> one integration run. GitHub's "Require branches to
    # be up to date before merging" must stay disabled for batched queues.
    batch_size: 3
    batch_max_wait_time: 30 seconds
    batch_max_failure_resolution_attempts: 10

    # Inert while batch_size > 1; kept so dropping to single-PR checks keeps the
    # branch fresh by rebase instead of silently changing behavior.
    update_method: rebase
    merge_method: merge

merge_queue:
  max_parallel_checks: 3

merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  auto_merge_conditions:
    - base = main
    - "-draft"
    - "#approved-reviews-by >= 1"
    - "#changes-requested-reviews-by = 0"
    - *gate

merge_protections:
  - name: CI before merge
    description: Preliminary CI gate. Green when the `ci` check succeeded.
    if:
      - base = main
    success_conditions:
      - *gate

priority_rules:
  - name: urgent — front of the queue
    conditions:
      - label = urgent
    priority: high
    allow_checks_interruption: true

pull_request_rules:
  - name: emergency merge — skips queue integration, retains preliminary CI
    conditions:
      - base = main
      - label = emergency-merge
      - -draft
      - *gate
    actions:
      merge:
        method: merge
      comment:
        message: >-
          Merged via the `emergency-merge` label — this bypassed the merge queue
          integration run after preliminary CI passed. Please confirm the branch
          is healthy.

commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write