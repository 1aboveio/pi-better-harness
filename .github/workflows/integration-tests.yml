name: Integration

on:
  push:
    branches:
      - "mergify/merge-queue/**"
  workflow_dispatch:

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          command -v bwrap
          bwrap --version

      - name: Enable and verify bubblewrap user namespaces
        run: |
          set -euo pipefail
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          probe_dir="$(mktemp -d "$RUNNER_TEMP/pi-bwrap-probe.XXXXXX")"
          trap 'rm -rf "$probe_dir"' EXIT
          bwrap --ro-bind / / --bind "$probe_dir" "$probe_dir" --bind /tmp /tmp --dev /dev -- /bin/true

      - name: Require the Linux Bubblewrap backend
        # Reads the same backend selection the confinement suites gate on, so a
        # runner without a usable bwrap fails here instead of running `verify`
        # with every real-kernel suite quietly skipped.
        run: node --import tsx scripts/require-sandbox-backend.mjs linux-bubblewrap

      - name: Run verification
        env:
          PI_SANDBOX_REQUIRE_BACKEND: linux-bubblewrap
        run: npm run verify

      - name: Run Linux bubblewrap confinement checks
        # `tests/*.test.mjs` is this package's test glob and does not match
        # `linux_bubblewrap.integration.mjs`, so `npm run verify` never reaches
        # it. It runs here, by name.
        env:
          PI_SANDBOX_REQUIRE_BACKEND: linux-bubblewrap
        run: npm run test:linux-sandbox -w packages/pi-better-subagents