name: Integration

on:
  push:
    branches:
      - "mergify/merge-queue/**"
  workflow_dispatch:

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          command -v bwrap
          bwrap --version

      - name: Enable and verify bubblewrap user namespaces
        run: |
          set -euo pipefail
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          probe_dir="$(mktemp -d "$RUNNER_TEMP/pi-bwrap-probe.XXXXXX")"
          trap 'rm -rf "$probe_dir"' EXIT
          bwrap --ro-bind / / --bind "$probe_dir" "$probe_dir" --bind /tmp /tmp --dev /dev -- /bin/true

      - name: Run verification
        run: npm run verify