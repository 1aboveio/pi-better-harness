name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish at its manifest version"
        required: true
        type: choice
        options:
          - pi-better-background-tasks
          - pi-better-subagents
          - pi-better-goal
          - pi-better-harness

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ inputs.package }}
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install latest npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Show toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        # The lockfile records registry tarball URLs from registry.npmmirror.com.
        # npm 11 defaults allow-remote=none, so allow committed lockfile URLs
        # during install while publish still targets registry.npmjs.org below.
        run: npm ci --allow-remote=all

      - name: Verify workspace
        run: npm run verify

      - name: Resolve package
        id: package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            pi-better-background-tasks) WORKSPACE="packages/pi-better-background-tasks" ;;
            pi-better-subagents) WORKSPACE="packages/pi-better-subagents" ;;
            pi-better-goal) WORKSPACE="packages/pi-better-goal" ;;
            pi-better-harness) WORKSPACE="packages/pi-better-harness" ;;
            *) echo "Unsupported package: $PACKAGE" >&2; exit 1 ;;
          esac

          VERSION="$(node -p "require('./${WORKSPACE}/package.json').version")"
          TAG="${PACKAGE}@${VERSION}"
          {
            echo "name=$PACKAGE"
            echo "workspace=$WORKSPACE"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: registry
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "${PACKAGE}@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already published; npm publish will be skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${PACKAGE}@${VERSION} is not published yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing package provenance
        if: steps.registry.outputs.published == 'true'
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://registry.npmjs.org/-/npm/v1/attestations/${PACKAGE}@${VERSION}" \
            > /tmp/attestations.json
          node -e '
            const { attestations = [] } = require("/tmp/attestations.json");
            const expected = process.env.GITHUB_SHA;
            const matches = attestations.some(({ bundle }) => {
              const encoded = bundle?.dsseEnvelope?.payload;
              if (!encoded) return false;
              const statement = JSON.parse(Buffer.from(encoded, "base64").toString("utf8"));
              return statement.predicate?.buildDefinition?.resolvedDependencies?.some(
                ({ digest }) => digest?.gitCommit === expected,
              );
            });
            if (!matches) throw new Error("published package provenance does not match " + expected);
          '

      - name: Pack dry run
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          WORKSPACE: ${{ steps.package.outputs.workspace }}
        run: |
          set -euo pipefail

          check_pack_file() {
            node -e 'const data=require(process.argv[1]); const p=Array.isArray(data) ? data[0] : Object.values(data)[0]; if (!p?.files?.some((f) => f.path === process.argv[2])) throw new Error("missing " + process.argv[2]);' "$1" "$2"
          }

          npm pack --dry-run -w "$WORKSPACE" --json --registry=https://registry.npmjs.org/ > /tmp/package-pack.json
          case "$PACKAGE" in
            pi-better-background-tasks)
              check_pack_file /tmp/package-pack.json src/shared-navigator.ts
              ;;
            pi-better-subagents)
              check_pack_file /tmp/package-pack.json shared-navigator.ts
              ;;
            pi-better-goal)
              check_pack_file /tmp/package-pack.json src/index.ts
              ;;
            pi-better-harness)
              for required in \
                bin/pi-better-harness.mjs \
                lib/cli.mjs \
                extensions/subagents/index.ts \
                extensions/background-tasks/index.ts \
                extensions/goal/index.ts \
                node_modules/pi-better-subagents/index.ts \
                node_modules/pi-better-background-tasks/src/index.ts \
                node_modules/pi-better-goal/src/index.ts
              do
                check_pack_file /tmp/package-pack.json "$required"
              done
              ;;
          esac

      - name: Publish package
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          WORKSPACE: ${{ steps.package.outputs.workspace }}
        run: |
          set -euo pipefail
          if npm view "${PACKAGE}@${VERSION}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "Skipping ${PACKAGE}@${VERSION}; already published."
          else
            npm publish -w "$WORKSPACE" --registry=https://registry.npmjs.org/
          fi

      - name: Verify npm version
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if npm view "${PACKAGE}@${VERSION}" version --registry=https://registry.npmjs.org/ >/tmp/npm-version.txt 2>/tmp/npm-version.err; then
              actual="$(cat /tmp/npm-version.txt)"
              if [ "$actual" = "$VERSION" ]; then
                echo "$PACKAGE@$actual"
                exit 0
              fi
            fi
            echo "Waiting for ${PACKAGE}@${VERSION} to be visible on npm (attempt ${attempt}/12)."
            sleep 10
          done
          cat /tmp/npm-version.err >&2 || true
          echo "${PACKAGE}@${VERSION} did not become visible on npm." >&2
          exit 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/tmp/release-tag.txt
          TAG_STATUS=$?
          set -e
          case "$TAG_STATUS" in
            0)
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
              TAG_SHA="$(git rev-list -n 1 "$TAG")"
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "$TAG already points to $TAG_SHA, expected $GITHUB_SHA." >&2
                exit 1
              fi
              ;;
            2)
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" "$GITHUB_SHA" -m "Release $TAG"
              git push origin "refs/tags/${TAG}"
              ;;
            *)
              echo "Could not determine whether $TAG already exists." >&2
              exit "$TAG_STATUS"
              ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists at the verified tag."
            exit 0
          fi

          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { in_release = 1; next }
            in_release && /^## / { exit }
            in_release { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if ! grep -q '[^[:space:]]' /tmp/release-notes.md; then
            echo "CHANGELOG.md has no release notes for ${TAG}." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
