# Branch-local diagnostic only. Never merge this workflow onto #831 or main.
name: 808 Hosted Bind Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-bind-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-bind:
    name: Diagnostic Hosted Bind (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Record diagnostic provenance
        env:
          DIAGNOSTIC_REPORT: ${{ runner.temp }}/808-hosted-bind-provenance.json
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          writeFileSync(process.env.DIAGNOSTIC_REPORT, JSON.stringify({
            mode: 'hosted-bind-diagnostic-not-acceptance',
            sourceBase: 'a7ced4f8ff4b5e8b738dd6ad5d14a63d0b74abf5',
            checkout: git('rev-parse', 'HEAD'),
            parents: git('show', '-s', '--format=%P', 'HEAD'),
            dirty: git('status', '--porcelain'),
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            platform: process.platform,
            arch: process.arch,
            node: process.version,
            guardedChild: Boolean(process.env.PI_SERVER_GUARDED_CHILD),
            inheritedActivation: Boolean(process.env.PI_SERVER_ACTIVATION_ID),
            command: 'node --import tsx packages/pi-better-server/scripts/measure-full-runtime.mjs --smoke --bind-only',
            diagnosticStepTimeoutSeconds: 120,
          }, null, 2));
          JS
      - run: npm ci
        id: install
      - name: Export pinned private runtime Node
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PI_TEST_PRIVATE_RUNTIME_NODE=" + process.execPath + "\n")'
      - name: Diagnose one hosted bind with both correctness extensions
        timeout-minutes: 2
        shell: bash
        env:
          PI_FULL_RUNTIME_REPORT: ${{ runner.temp }}/808-hosted-bind.json
          DIAGNOSTIC_LOG: ${{ runner.temp }}/808-hosted-bind.log
        run: |
          node --import tsx packages/pi-better-server/scripts/measure-full-runtime.mjs --smoke --bind-only 2>&1 | tee "$DIAGNOSTIC_LOG"
      - name: Retain incomplete reports and hook boundary on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 808-hosted-bind-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/808-hosted-bind-provenance.json
            ${{ runner.temp }}/808-hosted-bind.json
            ${{ runner.temp }}/808-hosted-bind.json.hosted-create.json
            ${{ runner.temp }}/808-hosted-bind.log
          if-no-files-found: error
          include-hidden-files: true
