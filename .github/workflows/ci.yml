name: Ubuntu Worker GC diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
      - uses: actions/checkout@v4
        with:
          ref: e0e9130ef0a44a5133986bf357d0bcc94823b22a
          path: subject
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - run: npm ci
        working-directory: driver
      - run: npm ci
        working-directory: subject
      - name: Verify observed worker identities
        working-directory: driver
        run: node --import tsx scripts/replay-worker-gc.mjs . node_modules ../subject