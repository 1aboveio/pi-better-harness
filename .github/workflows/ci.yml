name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the lanes a change has to prove. Every job below still runs so the
  # required check names keep reporting; only the expensive work is conditional.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspace: ${{ steps.areas.outputs.workspace }}
      sandbox: ${{ steps.areas.outputs.sandbox }}
      windows: ${{ steps.areas.outputs.windows }}
      server: ${{ steps.areas.outputs.server }}
      extensions: ${{ steps.areas.outputs.extensions }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diffing against the base branch needs history, not one commit.
          fetch-depth: 0
      - name: Select the lanes this change needs
        id: areas
        run: node scripts/ci-changed-areas.mjs
  # Two groups run as separate jobs so a server change waits for the slower
  # measurement only, not for both. Each group still gets its own clean VM, which
  # is what makes a resource measurement meaningful.
  shared-read-resources:
    name: shared-read-resources (${{ matrix.os }}, ${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        group: [runtime, reads]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      # Resource measurements need the locked dependency tree. Extra registry lookups
      # can hold this step open after npm has printed the installation summary.
      - run: npm ci --no-audit --no-fund --update-notifier=false
        id: install
      - name: Export pinned private runtime Node
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PI_TEST_PRIVATE_RUNTIME_NODE=" + process.execPath + "\n")'
      - name: Measure the complete managed runtime
        if: ${{ matrix.group == 'runtime' && !cancelled() && steps.install.outcome == 'success' }}
        env:
          PI_FULL_RUNTIME_REPORT: ${{ runner.temp }}/full-runtime-resources.json
        run: node --import tsx packages/pi-better-server/scripts/measure-full-runtime.mjs
      - name: Qualify packed standalone domains and cached offline restart
        if: ${{ matrix.group == 'runtime' && !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/pi-better-server
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test test/runtime-standalone.test.ts
      - name: Prove real socket recipient backpressure recovery
        if: ${{ matrix.group == 'runtime' && !cancelled() && steps.install.outcome == 'success' }}
        working-directory: packages/pi-better-server
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test test/runtime-assignment-slow-socket.test.ts
      - name: Measure real Pi and Server shared reads
        if: ${{ matrix.group == 'reads' && !cancelled() && steps.install.outcome == 'success' }}
        env:
          PI_SHARED_READ_REPORT: ${{ runner.temp }}/shared-read-resources.json
        run: node packages/pi-better-server/scripts/measure-shared-reads.mjs
      - name: Upload resource measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-read-resources-${{ matrix.os }}-${{ matrix.group }}
          path: |
            ${{ runner.temp }}/shared-read-resources.json
            ${{ runner.temp }}/full-runtime-resources.json
            .work/standalone-*/measurements.json
            .work/standalone-*/packaged-domain.log
            .work/standalone-*/recovery-timeline.jsonl
            .work/standalone-*/background-recovery.log
            .work/standalone-*/daemon.log
          if-no-files-found: warn
          include-hidden-files: true

  # Two groups so the Node 24 kernel proofs and the real-SDK replays do not wait
  # for each other. Both keep the require-backend contract.
  node24-sandbox:
    name: node24-sandbox (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [confinement, sdk]
    env:
      PI_SANDBOX_REQUIRE_BACKEND: linux-bubblewrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enable the Linux sandbox backend
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / -- /bin/true
          node --import tsx scripts/require-sandbox-backend.mjs linux-bubblewrap
      - name: Accept isolated Git writers, workspace recovery and partial results
        if: matrix.group == 'confinement'
        run: |
          node --import tsx --import ./packages/pi-better-subagents/tests/isolate-registry.mjs --test --test-concurrency=1 \
            packages/pi-better-subagents/tests/isolated-workspace.test.mjs \
            packages/pi-better-subagents/tests/git_clone_workspace_live.test.mjs \
            packages/pi-better-subagents/tests/timing_lifecycle.test.mjs
      - name: Verify Node 24 confinement and fixture cleanup
        if: matrix.group == 'confinement'
        run: |
          node --import tsx --import ./packages/pi-better-subagents/tests/isolate-registry.mjs --test packages/pi-better-subagents/tests/task_runtime.test.mjs
          node --import tsx --test packages/task-sandbox/apply-patch.test.ts
      - name: Prove sandboxed worker parking and resumption
        if: matrix.group == 'confinement'
        env:
          PI_WORKER_KERNEL_REQUIRE: "1"
        run: node --import tsx --test packages/pi-better-subagents/tests/worker-waits-kernel.test.mjs
      - name: Real SDK assignment authority replay
        if: matrix.group == 'sdk'
        env:
          WORKER_SDK_ONLY: "1"
        run: node --import tsx --test packages/pi-better-subagents/tests/worker-waits-kernel.test.mjs

      - name: Real SDK cancellation and exact-token crash recovery
        if: matrix.group == 'sdk'
        working-directory: packages/pi-better-server
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test test/runtime-cancellation.test.ts test/runtime-result-supervision.test.ts

      - name: Real SDK subagent launch and bootstrap fences
        if: matrix.group == 'sdk'
        working-directory: packages/pi-better-server
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test test/runtime-subagent-*.test.ts

  windows-verify:
    name: windows-verify
    needs: changes
    # Always runs so this required name keeps reporting; an empty selector
    # output means "prove everything".
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AFFECTED: ${{ needs.changes.outputs.windows || 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.AFFECTED == 'true'

      - uses: actions/setup-node@v4
        if: env.AFFECTED == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.AFFECTED == 'true'
        id: install
        run: npm ci

      # Existing SSH fixtures use /tmp; native Windows resolves it on this drive.
      - name: Prepare SSH fixtures and report native OpenSSH
        if: env.AFFECTED == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path /tmp | Out-Null
          & "$env:WINDIR\System32\OpenSSH\ssh.exe" -V
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Scoped on purpose: the root suite still assumes POSIX shells in places
      # (e.g. /bin/sh shebangs), so this lane proves what Windows must prove —
      # strict types, SSH contracts, shell resolution, and log redirection —
      # instead of failing on pre-existing POSIX-only expectations.
      - name: Typecheck the background-task package
        if: env.AFFECTED == 'true'
        run: npm run typecheck -w pi-better-background-tasks

      - name: Typecheck SSH core and extension
        if: ${{ env.AFFECTED == 'true' && !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck -w ssh-core -w pi-better-ssh

      - name: SSH core Windows contracts
        if: ${{ env.AFFECTED == 'true' && !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -w ssh-core

      - name: SSH extension Windows integration and packaging
        if: ${{ env.AFFECTED == 'true' && !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -w pi-better-ssh

      - name: Windows process unit and integration checks
        if: ${{ env.AFFECTED == 'true' && !cancelled() && steps.install.outcome == 'success' }}
        run: npx vitest run src/process-windows.test.ts src/process-windows.integration.test.ts src/runtime-windows.test.ts src/windows-paths.test.ts
        working-directory: packages/pi-better-background-tasks

  # Not a required check: runs the pi-better-server suite against Pi 1.x, which the workspace's Pi 0.82 cannot exercise.
  pi-1x-compat:
    name: pi-1x-compat (${{ matrix.pi-version }}, ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["1.2.0", "1.6.1"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Provision private runtime test Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Export private runtime test Node
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PI_TEST_PRIVATE_RUNTIME_NODE=" + process.execPath + "\n")'

      - name: Restore host Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex test dependency
        run: |
          npm install --global @openai/codex@0.159.2
          test "$(codex --version)" = "codex-cli 0.159.2"

      - name: pi-better-server suite on Pi ${{ matrix.pi-version }}
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
          PI_SDK_VERSION: ${{ matrix.pi-version }}
        run: bash packages/pi-better-server/scripts/test-on-pi.sh "$PI_SDK_VERSION" "$RUNNER_TEMP/pi-compat"

  # Verify extensions against each supported Pi 1.x baseline.
  pi-1x-compat-extensions:
    name: pi-1x-compat-extensions (${{ matrix.pi-version }})
    needs: changes
    if: needs.changes.outputs.extensions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pi-version: ["1.0.0", "1.3.0", "1.6.1"]
    env:
      PI_SDK_VERSION: ${{ matrix.pi-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Provision private runtime test Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Export private runtime test Node
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PI_TEST_PRIVATE_RUNTIME_NODE=" + process.execPath + "\n")'

      - name: Restore host Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enable the Linux sandbox backend for compatibility tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap tmux
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / -- /bin/true
          node --import tsx scripts/require-sandbox-backend.mjs linux-bubblewrap

      - name: Align workspace development dependencies with the Pi 1.6.1 host
        if: matrix.pi-version == '1.6.1'
        run: |
          node --input-type=module <<'NODE'
          import { globSync, readFileSync, writeFileSync } from "node:fs";
          for (const path of ["package.json", ...globSync("packages/*/package.json")]) {
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            const pins = Object.keys(manifest.devDependencies ?? {}).filter(name => name.startsWith("@earendil-works/pi-"));
            if (!pins.length) continue;
            for (const name of pins) manifest.devDependencies[name] = process.env.PI_SDK_VERSION;
            writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
          }
          NODE

      - name: Install selected Pi SDK without changing the lockfile
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ \
            "@earendil-works/pi-coding-agent@$PI_SDK_VERSION" \
            "@earendil-works/pi-ai@$PI_SDK_VERSION" \
            "@earendil-works/pi-tui@$PI_SDK_VERSION"

      - name: Verify each extension resolves the selected SDK
        run: |
          node --experimental-import-meta-resolve --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          for (const name of ["pi-better-background-tasks", "navigator", "pi-better-ssh"]) {
            const parent = pathToFileURL(resolve("packages", name, "package.json"));
            const entry = import.meta.resolve("@earendil-works/pi-coding-agent", parent.href);
            const { version } = JSON.parse(readFileSync(new URL("../package.json", entry), "utf8"));
            assert.equal(version, process.env.PI_SDK_VERSION, `${name} resolved the wrong Pi SDK`);
            console.log(`${name}: Pi ${version} at ${entry}`);
          }
          NODE

      - name: Typecheck affected extensions and shared modules
        if: matrix.pi-version != '1.6.1'
        run: npm run typecheck -w pi-better-background-tasks -w navigator -w ssh-core -w pi-better-ssh

      - name: Typecheck the workspace and exercise Harness on Pi 1.6.1
        if: matrix.pi-version == '1.6.1'
        run: |
          npm run typecheck
          node --import tsx --import ./scripts/isolate-registry.mjs --test \
            packages/pi-better-harness/test/{supervisor,session-recap,native-compaction}.test.mjs \
            packages/pi-better-harness/test/task-context/{dynamic-workflow,work-ledger,work-ledger-session}.test.ts

      - name: Verify Recap settings and foreground request isolation in Pi
        if: matrix.pi-version == '1.6.1'
        run: PI_RECAP_TEST_CLI="$PWD/node_modules/.bin/pi" node --import tsx --import ./scripts/isolate-registry.mjs --test scripts/session-recap.tui.e2e.test.mjs

      - name: Verify native remote browsing and attachment on Pi 1.6.1
        if: matrix.pi-version == '1.6.1'
        run: PI12_NATIVE_CLI="$PWD/node_modules/.bin/pi" node --import tsx --test packages/pi-better-server/test/pi-1.2-bridge.native.test.ts

      - name: Test background lifecycle, navigator, and SSH compatibility
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-sdk-compat-agent
        run: npm test -w pi-better-background-tasks -w navigator -w ssh-core -w pi-better-ssh

  workspace-ci:
    name: workspace-ci (${{ matrix.lane }})
    needs: changes
    if: needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        lane: [scripts-1, scripts-2, scripts-3, workspaces-1, workspaces-2, workspaces-3, meta-1]
    steps:
      - uses: actions/checkout@v4

      - name: Provision private runtime test Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Export private runtime test Node
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PI_TEST_PRIVATE_RUNTIME_NODE=" + process.execPath + "\n")'

      - name: Restore host Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install TUI and sandbox test dependencies
        if: matrix.lane != 'meta-1'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes tmux bubblewrap
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / -- /bin/true
          npm install --global @openai/codex@0.159.2
          test "$(codex --version)" = "codex-cli 0.159.2"

      - name: Select assignment projection performance checks
        if: matrix.lane == 'scripts-1'
        id: performance-scope
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/performance/ci-selection.mjs

      - name: Assignment projection performance budget
        id: performance
        if: steps.performance-scope.outputs.run == 'true'
        timeout-minutes: 2
        env:
          PI_PERF_REPORT: ${{ runner.temp }}/assignment-projection-performance.json
        run: npm run test:performance

      - name: Upload assignment projection performance metrics
        if: ${{ always() && (steps.performance.outcome == 'success' || steps.performance.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: assignment-projection-performance
          path: ${{ runner.temp }}/assignment-projection-performance.json
          if-no-files-found: warn

      - name: Check agent catalog
        if: matrix.lane == 'meta-1'
        run: npm run catalog:check

      - name: Typecheck
        if: matrix.lane == 'meta-1'
        run: npm run typecheck

      - name: Root script tests
        if: startsWith(matrix.lane, 'scripts-')
        env:
          PI_NAVIGATOR_EVIDENCE_DIR: ${{ runner.temp }}/navigator-golden
          TEST_LANE: ${{ matrix.lane }}
        run: node --import tsx --import ./scripts/isolate-registry.mjs --test --test-concurrency=1 --test-shard="${TEST_LANE#scripts-}/3" scripts/*.test.mjs

      - name: Stage bundled components for isolated workspace tests
        if: startsWith(matrix.lane, 'workspaces-')
        run: node scripts/stage-harness-dependencies.mjs

      - name: Workspace tests (Server runs in isolated shards)
        if: startsWith(matrix.lane, 'workspaces-')
        env:
          TEST_LANE: ${{ matrix.lane }}
        run: node scripts/test-ci-workspaces.mjs --shard "${TEST_LANE#workspaces-}/3"

      - name: Upload navigator golden-path evidence
        if: ${{ always() && startsWith(matrix.lane, 'scripts-') }}
        uses: actions/upload-artifact@v4
        with:
          name: navigator-golden-${{ matrix.lane }}
          path: ${{ runner.temp }}/navigator-golden
          if-no-files-found: warn

      - name: Cross-session leakage regressions
        if: matrix.lane == 'scripts-2'
        run: npm run test:cross-session

      - name: Package dry run
        if: matrix.lane == 'meta-1'
        run: |
          npm pack --dry-run --workspaces
          npm pack --dry-run -w packages/pi-better-harness --json > /tmp/pi-harness-pack.json
          for path in \
            bin/pi-better-harness.mjs \
            lib/cli.mjs \
            extensions/sandbox/index.ts \
            extensions/subagents/index.ts \
            extensions/background-tasks/index.ts \
            extensions/ssh/index.ts \
            extensions/goal/index.ts \
            extensions/execution-policy.ts \
            extensions/minimal-output/index.ts \
            extensions/tool-call-guard/index.ts \
            extensions/tool-call-guard/waits.ts \
            extensions/recap/index.ts \
            extensions/supervisor/index.ts \
            node_modules/pi-better-subagents/supervisor-client.mjs \
            extensions/recap/summary.ts \
            extensions/settings/index.ts \
            node_modules/pi-better-sandbox/index.ts \
            node_modules/pi-better-sandbox/shared-sandbox-core.ts \
            node_modules/pi-better-sandbox/shared-sandbox-diagnostics.ts \
            node_modules/pi-better-sandbox/diagnostics-command.ts \
            node_modules/pi-better-sandbox/shared-task-sandbox.ts \
            node_modules/pi-better-sandbox/shared-task-files.ts \
            node_modules/pi-better-sandbox/shared-task-exec.ts \
            node_modules/pi-better-sandbox/shared-task-application.ts \
            node_modules/pi-better-subagents/index.ts \
            node_modules/pi-better-subagents/shared-navigator.ts \
            node_modules/pi-better-subagents/shared-sandbox-core.ts \
            node_modules/pi-better-subagents/shared-sandbox-diagnostics.ts \
            node_modules/pi-better-subagents/shared-task-sandbox.ts \
            node_modules/pi-better-subagents/shared-task-files.ts \
            node_modules/pi-better-subagents/shared-task-exec.ts \
            node_modules/pi-better-subagents/shared-task-application.ts \
            node_modules/pi-better-subagents/task-runtime.mjs \
            node_modules/pi-better-subagents/task-guard.ts \
            node_modules/pi-better-subagents/task-policy.ts \
            node_modules/pi-better-subagents/shared-failure-observations.ts \
            node_modules/pi-better-subagents/shared-callback-batcher.ts \
            node_modules/pi-better-subagents/shared-execution-policy.ts \
            node_modules/pi-better-subagents/shared-worktree-context.ts \
            node_modules/pi-better-subagents/shared-operation-coordinator/index.ts \
            node_modules/pi-better-subagents/child-apply-patch.ts \
            node_modules/pi-better-subagents/child-process-list.ts \
            node_modules/pi-better-subagents/child-operations.ts \
            node_modules/pi-better-subagents/worker-waits.ts \
            node_modules/pi-better-background-tasks/src/index.ts \
            node_modules/pi-better-background-tasks/src/shared-navigator.ts \
            node_modules/pi-better-background-tasks/src/shared-sandbox-core.ts \
            node_modules/pi-better-background-tasks/src/shared-sandbox-diagnostics.ts \
            node_modules/pi-better-background-tasks/src/shared-failure-observations.ts \
            node_modules/pi-better-background-tasks/src/shared-callback-batcher.ts \
            node_modules/pi-better-background-tasks/src/shared-execution-policy.ts \
            node_modules/pi-better-background-tasks/src/shared-operation-coordinator/index.ts \
            node_modules/pi-better-background-tasks/src/observed-waits.ts \
            node_modules/pi-better-background-tasks/src/supervisor/generated/runner.mjs \
            node_modules/pi-better-background-tasks/src/supervisor/generated/store.mjs \
            node_modules/pi-better-ssh/src/index.ts \
            node_modules/pi-better-ssh/src/shared-ssh-core/index.ts \
            node_modules/pi-better-goal/src/index.ts \
            extensions/task-context/index.ts \
            extensions/project-context/index.ts \
            extensions/worktree-context.ts
          do
            # shellcheck disable=SC2016
            node -e 'const d = require(process.argv[1]); const pack = Array.isArray(d) ? d[0] : Object.values(d)[0]; if (!pack.files.some((file) => file.path === process.argv[2])) throw new Error(`missing bundled extension: ${process.argv[2]}`);' /tmp/pi-harness-pack.json "$path"
          done

          # The sandbox ships no launcher: users keep running ordinary `pi`.
          # shellcheck disable=SC2016
          node -e 'const d = require("/tmp/pi-harness-pack.json"); const pack = Array.isArray(d) ? d[0] : Object.values(d)[0]; const launcher = pack.files.find((file) => file.path.startsWith("node_modules/pi-better-sandbox/bin/")); if (launcher) throw new Error(`pi-better-sandbox must ship no launcher, found ${launcher.path}`);'

      # Run last: replace installed peers only, preserving baseline checks and the lockfile.
      - name: Native codemode batch compatibility (Pi 0.99.1)
        if: matrix.lane == 'scripts-3'
        timeout-minutes: 5
        env:
          PI_CODEMODE_TEST_REQUIRED: "1"
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ @earendil-works/pi-coding-agent@0.99.1 @earendil-works/pi-ai@0.99.1 @earendil-works/pi-tui@0.99.1
          node --import tsx --import ./packages/pi-better-subagents/tests/isolate-registry.mjs --test packages/pi-better-subagents/tests/codemode_batch.test.mjs
          node --import tsx --import ./scripts/isolate-registry.mjs --test scripts/goal-retry-runtime.test.mjs

  server-tests:
    name: server-tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Provision private runtime test Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Export private runtime test Node
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "PI_TEST_PRIVATE_RUNTIME_NODE=" + process.execPath + "\n")'

      - name: Restore host Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install TUI and sandbox test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes tmux bubblewrap
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / -- /bin/true
          npm install --global @openai/codex@0.159.2
          test "$(codex --version)" = "codex-cli 0.159.2"

      - name: Synchronize Server test dependencies
        run: npm run pretest -w packages/pi-better-server

      - name: Server test shard
        working-directory: packages/pi-better-server
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test --test-concurrency=4 --test-shard="$TEST_SHARD/3" test/*.test.ts

  # Keep the existing required check name. A lane may report skipped only when the
  # selector said its area did not change; any other skip, failure or cancellation
  # fails this check.
  #
  # shared-read-resources is deliberately not part of this gate. It measures
  # publication latency across 50 real Pi subscribers on a shared runner, where
  # one stalled notification round fails a bound whose median sits four times
  # inside it. It still runs and still reports; the one-second publication
  # contract stays enforced by runtime-event-publication.test.ts and
  # query-executor.test.ts inside server-tests, which this gate does require.
  ci:
    name: ci
    if: always()
    needs: [changes, workspace-ci, server-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKSPACE_AREA: ${{ needs.changes.outputs.workspace }}
          SERVER_AREA: ${{ needs.changes.outputs.server }}
          WORKSPACE_RESULT: ${{ needs.workspace-ci.result }}
          SERVER_RESULT: ${{ needs.server-tests.result }}
        run: |
          set -uo pipefail
          fail=0
          # check <lane> <result> <area changed: true|false>
          check() {
            case "$2" in
              success) echo "ok   $1" ;;
              skipped)
                if [ "$3" = "true" ]; then
                  echo "::error::$1 skipped although its area changed"
                  fail=1
                else
                  echo "skip $1 (no related change)"
                fi ;;
              *) echo "::error::$1: $2"; fail=1 ;;
            esac
          }
          # A broken selector means the lanes below ran with their fallback, so the
          # gate stays red until the selector is repaired.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::changes: $CHANGES_RESULT; lane selection did not run"
            fail=1
          fi
          check workspace-ci "$WORKSPACE_RESULT" "$WORKSPACE_AREA"
          check server-tests "$SERVER_RESULT" "$SERVER_AREA"
          exit "$fail"

  # Five focused macOS lanes behind one required name. Running the same suites
  # in a single job took eleven minutes, because every journey waited for the
  # one before it.
  macos-lifecycle:
    name: macos-sandbox (lifecycle)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # Turns "no backend, so skip" into a hard failure on a lane whose whole
      # point is that backend.
      PI_SANDBOX_REQUIRE_BACKEND: macos-seatbelt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the macOS Seatbelt backend
        run: node --import tsx scripts/require-sandbox-backend.mjs macos-seatbelt
      - name: Prove runtime lifecycle with real processes and sockets
        run: node --import tsx --import ./scripts/isolate-registry.mjs --test --test-concurrency=1 packages/pi-better-server/test/runtime-lifecycle.test.ts packages/pi-better-server/test/daemon-owner.test.ts

  macos-cancellation:
    name: macos-sandbox (cancellation)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # Turns "no backend, so skip" into a hard failure on a lane whose whole
      # point is that backend.
      PI_SANDBOX_REQUIRE_BACKEND: macos-seatbelt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the macOS Seatbelt backend
        run: node --import tsx scripts/require-sandbox-backend.mjs macos-seatbelt
      - name: Prove cancellation authority and crash recovery with real processes
        working-directory: packages/pi-better-server
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test test/runtime-cancellation.test.ts test/runtime-result-supervision.test.ts

  macos-subagent:
    name: macos-sandbox (subagent ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # Turns "no backend, so skip" into a hard failure on a lane whose whole
      # point is that backend.
      PI_SANDBOX_REQUIRE_BACKEND: macos-seatbelt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the macOS Seatbelt backend
        run: node --import tsx scripts/require-sandbox-backend.mjs macos-seatbelt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Accept checkout recovery under macOS Seatbelt
        if: matrix.shard == 1
        run: node --import tsx --import ./scripts/isolate-registry.mjs --test packages/pi-better-subagents/tests/isolated-workspace.test.mjs
      - name: Accept tool loading and use permissions in a real SDK worker
        if: matrix.shard == 1
        run: node --import tsx --import ./scripts/isolate-registry.mjs --test packages/pi-better-subagents/tests/continuation.test.mjs
      - name: Prove subagent launch and bootstrap ownership on Node 24
        working-directory: packages/pi-better-server
        run: node --import tsx --import ../../scripts/isolate-registry.mjs --test --test-shard="${{ matrix.shard }}/2" test/runtime-subagent-*.test.ts

  macos-confined-packages:
    name: macos-sandbox (confined packages)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # Turns "no backend, so skip" into a hard failure on a lane whose whole
      # point is that backend.
      PI_SANDBOX_REQUIRE_BACKEND: macos-seatbelt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the macOS Seatbelt backend
        run: node --import tsx scripts/require-sandbox-backend.mjs macos-seatbelt
      - name: Run macOS compatibility golden paths
        timeout-minutes: 5
        env:
          PI_SANDBOX_EVIDENCE_DIR: ${{ runner.temp }}/sandbox-golden-macos
        run: npm run test:golden:sandbox
      - name: Upload macOS compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-golden-macos
          path: ${{ runner.temp }}/sandbox-golden-macos
          if-no-files-found: error
      # One step for the three package suites: same commands, same order, fewer
      # npm wrappers to keep in sync.
      - name: Run sandbox package confinement suites
        run: |
          set -euo pipefail
          npm test -w packages/sandbox-core
          npm test -w packages/task-sandbox
          npm run sync:task-sandbox
          node --import tsx --test packages/pi-better-subagents/tests/task_runtime.test.mjs
          npm test -w packages/pi-better-sandbox
      - name: Run local background-task confinement checks
        run: npm run test:sandbox -w packages/pi-better-background-tasks

  macos-confined-harness:
    name: macos-sandbox (confined harness)
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # Turns "no backend, so skip" into a hard failure on a lane whose whole
      # point is that backend.
      PI_SANDBOX_REQUIRE_BACKEND: macos-seatbelt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the macOS Seatbelt backend
        run: node --import tsx scripts/require-sandbox-backend.mjs macos-seatbelt
      # The whole-session demonstration gates itself on a real backend, and the
      # only job that runs the root suite is `ci`, which has none — so without
      # this step it skips everywhere and proves nothing. PI_SANDBOX_REQUIRE_BACKEND
      # is already set for this lane, which turns that skip into a hard failure.
      - name: Run the whole-session harness demonstration
        run: node --import tsx --import ./scripts/isolate-registry.mjs --test scripts/harness-session.e2e.test.mjs
      - name: Run macOS sandbox-exec confinement checks
        run: npm run test:macos-sandbox -w packages/pi-better-subagents

  # Required check name for the macOS sandbox proof. The work runs in two
  # parallel halves so neither sits near a twenty-minute ceiling; this job only
  # reduces their results, so the required name keeps reporting.
  macos-sandbox:
    name: macos-sandbox
    needs: [changes, macos-lifecycle, macos-cancellation, macos-subagent, macos-confined-packages, macos-confined-harness]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both macOS halves
        env:
          AFFECTED: ${{ needs.changes.outputs.sandbox || 'true' }}
          LIFECYCLE_RESULT: ${{ needs.macos-lifecycle.result }}
          CANCELLATION_RESULT: ${{ needs.macos-cancellation.result }}
          SUBAGENT_RESULT: ${{ needs.macos-subagent.result }}
          PACKAGES_RESULT: ${{ needs.macos-confined-packages.result }}
          HARNESS_RESULT: ${{ needs.macos-confined-harness.result }}
        run: |
          set -uo pipefail
          fail=0
          # check <lane> <result>
          check() {
            case "$2" in
              success) echo "ok   $1" ;;
              skipped)
                if [ "$AFFECTED" = "true" ]; then
                  echo "::error::$1 skipped although sandbox paths changed"
                  fail=1
                else
                  echo "skip $1 (no sandbox change)"
                fi ;;
              *) echo "::error::$1: $2"; fail=1 ;;
            esac
          }
          check macos-lifecycle "$LIFECYCLE_RESULT"
          check macos-cancellation "$CANCELLATION_RESULT"
          check macos-subagent "$SUBAGENT_RESULT"
          check macos-confined-packages "$PACKAGES_RESULT"
          check macos-confined-harness "$HARNESS_RESULT"
          exit "$fail"

  linux-sandbox:
    name: linux-sandbox
    needs: changes
    # Always runs so this required name keeps reporting; an empty selector
    # output means "prove everything".
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Same contract as the macOS lane: a runner that has lost bubblewrap must
      # fail here rather than report a skipped suite.
      PI_SANDBOX_REQUIRE_BACKEND: linux-bubblewrap
      AFFECTED: ${{ needs.changes.outputs.sandbox || 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.AFFECTED == 'true'

      - uses: actions/setup-node@v4
        if: env.AFFECTED == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.AFFECTED == 'true'
        run: npm ci

      - name: Install bubblewrap
        if: env.AFFECTED == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes tmux bubblewrap dbus-x11 gnome-keyring libsecret-tools
          command -v bwrap
          bwrap --version

      - name: Accept both /sandbox sections in the real Pi terminal
        if: env.AFFECTED == 'true'
        run: |
          tmux -V
          node --import tsx --import ./scripts/isolate-registry.mjs --test scripts/sandbox-permissions.tui.e2e.test.mjs

      - name: Enable and verify bubblewrap user namespaces
        if: env.AFFECTED == 'true'
        run: |
          set -euo pipefail
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          probe_dir="$(mktemp -d "$RUNNER_TEMP/pi-bwrap-probe.XXXXXX")"
          trap 'rm -rf "$probe_dir"' EXIT
          bwrap --ro-bind / / --bind "$probe_dir" "$probe_dir" --bind /tmp /tmp --dev /dev -- /bin/true

      - name: Require the Linux Bubblewrap backend
        if: env.AFFECTED == 'true'
        # Reads the same backend selection the suites below gate on, so the probe
        # and the suites cannot disagree about whether this lane proved anything.
        run: node --import tsx scripts/require-sandbox-backend.mjs linux-bubblewrap

      - name: Run Linux compatibility golden paths
        if: env.AFFECTED == 'true'
        timeout-minutes: 5
        env:
          PI_SANDBOX_EVIDENCE_DIR: ${{ runner.temp }}/sandbox-golden-linux
        run: npm run test:golden:sandbox

      - name: Upload Linux compatibility evidence
        if: ${{ env.AFFECTED == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-golden-linux
          path: ${{ runner.temp }}/sandbox-golden-linux
          if-no-files-found: error

      # One step for the three package suites: same commands, same order, fewer
      # npm wrappers to keep in sync.
      - name: Run sandbox package confinement suites
        if: env.AFFECTED == 'true'
        run: |
          set -euo pipefail
          npm test -w packages/sandbox-core
          npm test -w packages/task-sandbox
          npm run sync:task-sandbox
          node --import tsx --test packages/pi-better-subagents/tests/task_runtime.test.mjs
          npm test -w packages/pi-better-sandbox

      - name: Run local background-task confinement checks
        if: env.AFFECTED == 'true'
        run: npm run test:sandbox -w packages/pi-better-background-tasks

      # The whole-session demonstration gates itself on a real backend, and the
      # only job that runs the root suite is `ci`, which has none — so without
      # this step it skips everywhere and proves nothing. PI_SANDBOX_REQUIRE_BACKEND
      # is already set for this lane, which turns that skip into a hard failure.
      - name: Run the whole-session harness demonstration
        if: env.AFFECTED == 'true'
        run: node --import tsx --import ./scripts/isolate-registry.mjs --test scripts/harness-session.e2e.test.mjs

      - name: Run Linux bubblewrap confinement checks
        if: env.AFFECTED == 'true'
        run: npm run test:linux-sandbox -w packages/pi-better-subagents
