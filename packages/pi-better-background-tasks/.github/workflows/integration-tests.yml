name: integration

on:
  push:
    branches:
      - "mergify/merge-queue/**"
  workflow_dispatch:

jobs:
  integration:
    name: integration
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E tool-boundary tests
        run: npm run test:e2e

      - name: Golden path journey
        run: npm run test:golden