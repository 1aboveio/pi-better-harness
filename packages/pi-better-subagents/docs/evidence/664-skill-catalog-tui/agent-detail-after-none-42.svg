  <text x="20" y="168" xml:space="preserve"><tspan fill="#d7d8de">      high  </tspan><tspan fill="#6b6c75">inherited</tspan></text>
  <text x="20" y="186" xml:space="preserve"><tspan fill="#d7d8de">  </tspan><tspan fill="#7dd3fc">&gt; Skills</tspan></text>
