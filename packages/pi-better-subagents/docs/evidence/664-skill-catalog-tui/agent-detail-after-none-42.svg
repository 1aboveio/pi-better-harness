  <text x="20" y="60" xml:space="preserve"><tspan fill="#7dd3fc">[Settings]</tspan><tspan fill="#d7d8de">   </tspan><tspan fill="#6b6c75">Instructions</tspan><tspan fill="#d7d8de">   </tspan><tspan fill="#6b6c75">Files</tspan></text>
