  <text x="20" y="312" xml:space="preserve"><tspan fill="#d7d8de">  Scope    user</tspan></text>
  <text x="20" y="330" xml:space="preserve"><tspan fill="#d7d8de">  Role     role.work</tspan></text>
  <text x="20" y="348" xml:space="preserve"><tspan fill="#d7d8de">  Tier     balanced</tspan></text>
