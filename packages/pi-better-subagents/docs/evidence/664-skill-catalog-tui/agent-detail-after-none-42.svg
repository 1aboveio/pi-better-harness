  <text x="20" y="240" xml:space="preserve"><tspan fill="#d7d8de">  </tspan><tspan fill="#6b6c75">Model and effort are session edits.</tspan></text>
  <text x="20" y="258" xml:space="preserve"><tspan fill="#d7d8de">  </tspan><tspan fill="#6b6c75">Skills save to the definition.</tspan></text>
