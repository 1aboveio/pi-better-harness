name: Integration

# Step 2 of the two-step merge queue: real pi + model + gh integration tests.
# Runs ONLY on Mergify merge-queue branches (and manual dispatch for debugging).
# Required by merge_conditions in .mergify.yml as check-success = integration.
#
# Secrets:
#   MINIMAX_API_KEY — MiniMax China API key (same as local $MINIMAX_API_KEY)
#   GH_TOKEN        — optional; falls back to github.token for same-repo gh calls

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PI_SUBAGENT_TEST_MODEL: minimax-cn/MiniMax-M3
  PI_SUBAGENT_TEST_TIMEOUT: "300"
  # Prefer a dedicated PAT if set; otherwise the job token is enough for
  # `gh issue list` against this same repository.
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
  # Local models.json uses $MINIMAX_API_KEY for the minimax-cn provider.
  # Builtin pi also accepts MINIMAX_CN_API_KEY for provider minimax-cn.
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

jobs:
  integration:
    name: integration
    # Queue-only: Mergify opens PRs whose head branch is mergify/merge-queue/…
    # workflow_dispatch keeps a manual escape hatch for debugging.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.head_ref, 'mergify/merge-queue/')
    # Bubblewrap is the Linux sandbox backend. Run this queue lane on the
    # supported Ubuntu image so real confinement is a required integration gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bubblewrap
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          command -v bwrap
          bwrap --version

      - name: Enable and verify bubblewrap user namespaces
        run: |
          set -euo pipefail
          # Ubuntu 24.04 runners can restrict unprivileged user namespaces with
          # AppArmor. bubblewrap then discovers successfully but cannot write its
          # UID map. This ephemeral queue runner must permit bwrap itself to
          # initialize; the real confinement test below remains mandatory.
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          fi
          probe_dir="$(mktemp -d "$RUNNER_TEMP/pi-bwrap-probe.XXXXXX")"
          trap 'rm -rf "$probe_dir"' EXIT
          # Use the product's root/read-only plus writable-workdir, /tmp, and
          # /dev topology. Any unavailable selected backend fails this lane.
          bwrap \
            --ro-bind / / \
            --bind "$probe_dir" "$probe_dir" \
            --bind /tmp /tmp \
            --dev /dev \
            -- /bin/true

      - name: Ensure GitHub CLI is installed
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            exit 0
          fi
          version=2.96.0
          archive="gh_${version}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          curl -fsSL \
            "https://github.com/cli/cli/releases/download/v${version}/${archive}" \
            -o "$archive_path"
          expected=83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          actual=$(sha256sum "$archive_path" | awk '{print $1}')
          if [ "$actual" != "$expected" ]; then
            echo "::error::GitHub CLI archive checksum mismatch"
            exit 1
          fi
          tar -xzf "$archive_path" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Install pi CLI
        run: npm install -g @earendil-works/pi-coding-agent

      - name: Install web-tools extension (provides web_fetch)
        # web_fetch is NOT a pi built-in — it comes from this package (present
        # locally via settings.json). Install it so the web_fetch scenario has
        # the tool it needs; a bare pi install only has read/bash/edit/write.
        run: |
          set -euo pipefail
          pi install npm:@juicesharp/rpiv-web-tools
          pi list 2>&1 | grep -qi 'rpiv-web-tools' \
            || { echo "::error::rpiv-web-tools not installed"; exit 1; }

      - name: Install local MiniMax-CN model config
        # Mirrors ~/.pi/agent/models.json minimax-cn provider so
        # PI_SUBAGENT_TEST_MODEL=minimax-cn/MiniMax-M3 resolves the same way
        # as a local pi session (api.minimaxi.com + $MINIMAX_API_KEY).
        run: |
          set -euo pipefail
          if [ -z "${MINIMAX_API_KEY:-}" ]; then
            echo "::error::MINIMAX_API_KEY secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.pi/agent"
          # Write via python so the JSON is never YAML-indent-polluted.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          cfg = {
              "providers": {
                  "minimax-cn": {
                      "apiKey": "$MINIMAX_API_KEY",
                      "api": "anthropic-messages",
                      "baseUrl": "https://api.minimaxi.com/anthropic",
                      "models": [{
                          "id": "MiniMax-M3",
                          "name": "MiniMax-M3",
                          "reasoning": True,
                          "input": ["text", "image"],
                          "contextWindow": 512000,
                          "maxTokens": 128000,
                          "cost": {
                              "input": 0.6,
                              "output": 2.4,
                              "cacheRead": 0.12,
                              "cacheWrite": 0,
                          },
                      }],
                  }
              }
          }
          path = Path.home() / ".pi" / "agent" / "models.json"
          path.write_text(json.dumps(cfg, indent=2) + "\n")
          print(f"wrote {path}")
          PY
          pi --list-models 2>&1 | grep -E 'minimax-cn|MiniMax-M3' || {
            echo "::error::minimax-cn/MiniMax-M3 did not register"
            exit 1
          }

      - name: Verify tooling
        run: |
          pi --version
          gh --version
          gh api user --jq .login
          # Smoke: gh can see this repo's issues (the integration test does this via the child).
          gh issue list -R "${{ github.repository }}" --state open --json number --jq length

      - name: Run queue integration tests
        run: |
          node --test tests/linux_bubblewrap.integration.mjs
          bash tests/run_queue.sh
